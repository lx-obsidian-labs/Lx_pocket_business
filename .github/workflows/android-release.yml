name: Android release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ADMOB_APP_ID: 'ca-app-pub-8968817915668565~6466180772'
      ADMOB_BANNER_UNIT_ID: 'ca-app-pub-8968817915668565/5274846043'
      ADMOB_INTERSTITIAL_UNIT_ID: 'ca-app-pub-8968817915668565/9182301467'
      ADMOB_REWARDED_UNIT_ID: 'ca-app-pub-8968817915668565/1802504899'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release configuration
        shell: bash
        run: |
          for key in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD ADMOB_APP_ID ADMOB_BANNER_UNIT_ID; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing required secret $key"; exit 1; fi
          done
          [[ "$ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]+~[0-9]+$ ]] || exit 1
          [[ "$ADMOB_BANNER_UNIT_ID" =~ ^ca-app-pub-[0-9]+/[0-9]+$ ]] || exit 1
          [[ "$ADMOB_APP_ID" != ca-app-pub-3940256099942544~* ]] || exit 1
          [[ "$ADMOB_BANNER_UNIT_ID" != ca-app-pub-3940256099942544/* ]] || exit 1
      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0"
      - name: Configure signing and ads
        shell: bash
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          python3 - <<'PY'
          import os
          def escape(s):
              return ''.join('\\u%04x' % ord(c) if ord(c) < 32 or ord(c) > 126 else '\\' + c if c in '\\ :=#!' else c for c in s)
          def write(path, values):
              with open(path, 'w') as f:
                  for k,v in values.items():
                      f.write(k + '=' + escape(v) + '\n')
          write('keystore.properties', {
              'storeFile': os.environ['RUNNER_TEMP'] + '/upload.jks',
              'storePassword': os.environ['STORE_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
              'keyPassword': os.environ['KEY_PASSWORD']})
          write('local.properties', {
              'sdk.dir': os.environ['ANDROID_HOME'],
              'admob.app.id': os.environ['ADMOB_APP_ID'],
              'admob.banner.unit.id': os.environ['ADMOB_BANNER_UNIT_ID'],
              'admob.interstitial.unit.id': os.environ['ADMOB_INTERSTITIAL_UNIT_ID'],
              'admob.rewarded.unit.id': os.environ['ADMOB_REWARDED_UNIT_ID']})
          PY
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease bundleRelease assembleRelease
      - name: Verify signatures and checksums
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/bundle/release/*.aab release-artifacts/
          cp app/build/outputs/apk/release/*.apk release-artifacts/
          for bundle in release-artifacts/*.aab; do
            jarsigner -verify "$bundle"
            keytool -printcert -jarfile "$bundle" >/dev/null
          done
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          for apk in release-artifacts/*.apk; do "$APKSIGNER" verify --verbose "$apk"; done
          (cd release-artifacts && sha256sum *.aab *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: lx-pocket-business-release-${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties local.properties "$RUNNER_TEMP/upload.jks"
